<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | Cloud Computing with AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

.login-card{
    background: rgba(255,255,255,0.95);
    width:350px;
    padding:35px 30px;
    border-radius:14px;
    box-shadow:0 15px 40px rgba(0,0,0,0.4);
    text-align:center;
}

.login-card h2{
    color:#0a3d62;
    margin-bottom:5px;
}

.sub-text{
    font-size:14px;
    color:#555;
    margin-bottom:25px;
}

.input-group{
    position:relative;
    margin-bottom:18px;
}

.input-group input{
    width:100%;
    padding:12px 40px 12px 14px;
    border-radius:8px;
    border:1.5px solid #ccc;
    font-size:15px;
    outline:none;
}

.input-group input:focus{
    border-color:#0a3d62;
}

.eye{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    font-size:18px;
}

button{
    width:100%;
    padding:12px;
    background:#0a3d62;
    border:none;
    border-radius:8px;
    color:white;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#06314e;
}

#error{
    color:red;
    margin-top:10px;
    font-size:14px;
}

.forgot{
    display:block;
    margin-top:15px;
    text-decoration:none;
    color:#0a3d62;
    font-size:14px;
}
</style>
</head>

<body>

<div class="login-card">
    <h2>Welcome Back</h2>
    <p class="sub-text">Login to Cloud Computing with AI</p>

    <div class="input-group">
        <input type="text" id="username" placeholder="Username">
    </div>

    <div class="input-group">
        <input type="password" id="password" placeholder="Password">
        <span class="eye" onclick="togglePassword()">👁</span>
    </div>

    <button onclick="checkLogin()">Sign In</button>

    <p id="error"></p>

    <a href="#" class="forgot"
       onclick="alert('Username: Admin\nPassword: 12345')">
       Forgot password?
    </a>
</div>

<script>
function togglePassword(){
    const pass = document.getElementById("password");
    pass.type = pass.type === "password" ? "text" : "password";
}

function checkLogin(){
    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;
    const error = document.getElementById("error");

    if(user === "Admin" && pass === "12345"){
        error.innerHTML = "";
        window.location.href = "index.html";   // ✅ HOME PAGE CONNECTED
    }else{
        error.innerHTML = "Invalid Username or Password";
    }
}
</script>

</body>
</html>
